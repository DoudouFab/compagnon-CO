<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chroniques Oubliées – Compagnon PJ Pro</title>
<style>
:root{
  --bg:#12100e;--p:#1b1713;--p2:#262019;--p3:#322a21;--ln:#423628;
  --gold:#d4a84a;--gold2:#f3d48d;--red:#9c2a2b;--tx:#ede3d1;--mu:#9e907d;
  --ok:#6fa85b;--ko:#cf5544;--accent:#c97d32;--sp:#7c5ebb;--mana:#3a69a1;--mana2:#8dbbff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5;padding-bottom:86px;font-size:15px}
h1,h2,h3,h4{font-family:Georgia,serif;font-weight:700}
header{background:linear-gradient(180deg,#2b1510,var(--bg));border-bottom:1px solid var(--ln);padding:12px 16px;text-align:center;position:sticky;top:0;z-index:20}
header h1{color:var(--gold);font-size:1.15rem;letter-spacing:.15em;text-transform:uppercase}
header small{color:var(--mu);letter-spacing:.18em;font-size:.65rem;text-transform:uppercase}
main{max-width:960px;margin:0 auto;padding:12px}

nav#nav{position:fixed;left:0;right:0;bottom:0;background:#15120f;border-top:1px solid var(--ln);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:40}
nav#nav button{flex:1;max-width:140px;background:none;border:0;color:var(--mu);font-size:.72rem;font-weight:600;padding:6px 2px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav#nav button span{font-size:1.25rem;line-height:1}
nav#nav button.on{color:var(--gold);background:rgba(212,168,74,.15)}

.card{background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}
.card h3{color:var(--gold);font-size:1.05rem;margin-bottom:10px}
.hero{background:linear-gradient(135deg,#361917,#1c1813);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}
.mu{color:var(--mu);font-size:.85rem}.ok{color:var(--ok)}.ko{color:var(--ko)}.wn{color:#e0a030;font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
button.b{background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px 12px;font-weight:600;font-size:.85rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.b:hover{border-color:var(--gold)}button.gold{background:var(--gold);color:#1b1406;border-color:var(--gold)}button.red{background:var(--red);border-color:var(--red);color:#fff}button.sm{padding:4px 8px;min-height:28px;font-size:.78rem}button.purple{background:#3d2a58;border-color:#6c4b9b;color:#d7c4f7}button.mana-btn{background:#233a59;border-color:var(--mana);color:var(--mana2)}
input,select,textarea{width:100%;padding:8px 10px;background:var(--p2);border:1px solid var(--ln);color:var(--tx);border-radius:8px;font-size:.92rem;margin:4px 0 8px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:-1px}
label{font-size:.68rem;color:var(--mu);font-weight:700;text-transform:uppercase;letter-spacing:.05em;display:block}

.g{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.g3{display:grid;gap:8px;grid-template-columns:repeat(3,1fr)}
.g6{display:grid;gap:8px;grid-template-columns:repeat(6,1fr)}
@media(max-width:700px){.g6{grid-template-columns:repeat(3,1fr)}}

.tile{background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:8px 6px;text-align:center}
.tile small{display:block;color:var(--mu);font-size:.65rem;text-transform:uppercase;letter-spacing:.06em}
.tile b{display:block;font:700 1.35rem Georgia,serif;color:var(--gold2)}
.tile i{font-style:normal;font-size:.82rem;color:var(--ok);font-weight:700}

/* JAUGES */
.v-zone{background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:12px;margin:8px 0}
.v-bar{height:14px;background:#0c0a08;border-radius:7px;overflow:hidden;border:1px solid var(--ln);margin-bottom:6px}
.v-bar div{height:100%;transition:width .2s}
input[type=range].slider-ctrl{-webkit-appearance:none;width:100%;height:8px;background:#0d0b09;border-radius:5px;outline:none;border:1px solid var(--ln);margin:6px 0}
input[type=range].slider-ctrl::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--gold);border:2px solid #fff;cursor:pointer}
input[type=range].slider-mana::-webkit-slider-thumb{background:var(--mana2);border-color:#fff}

.opt{background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:11px;margin-bottom:8px}
.opt.sel{border-color:var(--gold);background:rgba(212,168,74,.1)}
.chain{padding:4px 0}
.rk{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--ln);border-radius:10px;margin-bottom:8px;background:var(--p2)}
.rk i{font-style:normal;background:#0c0a08;border:2px solid var(--ln);border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex:none;font-weight:700;margin-top:2px}
.rk.have{border-color:var(--ok);background:rgba(111,168,91,.08)}
.rk.have i{background:var(--ok);color:#0a1707;border-color:var(--ok)}
.rk.next{border-color:var(--gold);box-shadow:0 0 8px rgba(212,168,74,.25)}
.rk.next i{border-color:var(--gold);color:var(--gold)}
.rk.lock{opacity:.45}

details.active-way{border:1.5px solid var(--gold);box-shadow:0 0 10px rgba(212,168,74,.15)}
details summary{padding:12px;cursor:pointer;font:700 1rem Georgia,serif;color:var(--gold);list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"▾";float:right;color:var(--mu)}
details[open] summary::after{content:"▴"}

.drawer{position:fixed;top:0;right:-100%;bottom:0;width:100%;max-width:440px;background:var(--p);border-left:1px solid var(--gold);box-shadow:-6px 0 30px rgba(0,0,0,.85);z-index:60;transition:right .3s ease;display:flex;flex-direction:column}
.drawer.open{right:0}
.drawer-header{padding:14px;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;align-items:center}
.drawer-body{padding:14px;overflow-y:auto;flex:1}

.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:70;align-items:center;justify-content:center;padding:14px}
.ov.on{display:flex}
.sheet{background:var(--p);border:1px solid var(--gold);border-radius:14px;width:100%;max-width:700px;max-height:92vh;display:flex;flex-direction:column}
#mh{padding:14px 18px;color:var(--gold);font:700 1.1rem Georgia,serif;border-bottom:1px solid var(--ln)}
.prog{height:5px;background:#0c0a08}.prog div{height:100%;background:var(--gold);transition:width .25s}
#mb{padding:14px 18px;overflow-y:auto;flex:1}
#mf{padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--ln);display:flex;gap:8px}

.tag{display:inline-block;padding:2px 6px;border-radius:4px;font-size:.7rem;font-weight:600;margin-right:4px}
.tag-l{background:#632c2d;color:#ffb8b8}.tag-s{background:#2a4563;color:#b0d7ff}.tag-pack{background:#543818;color:#f3d48d}
.note-inp{background:#18130e;border:1px dashed var(--ln);color:#ddd;font-size:.8rem;padding:4px 8px;border-radius:6px;width:100%;margin-top:4px}
.note-inp:focus{border-style:solid;outline:none;border-color:var(--gold)}
.qty-num-input{width:60px;text-align:center;font-weight:700;color:var(--gold2);padding:2px 4px;margin:0;border-radius:6px}

/* STYLES D'IMPRESSION SUR PAPIER (A4) */
@media print {
  body { background: #fff !important; color: #000 !important; font-size: 10pt !important; padding: 0 !important; }
  header, nav, .drawer, .ov, .no-print, button, input[type=range], .v-bar { display: none !important; }
  .card, .hero, .tile, .opt { background: #fff !important; border: 1px solid #444 !important; color: #000 !important; box-shadow: none !important; page-break-inside: avoid; margin-bottom: 8px !important; padding: 8px !important; }
  h1, h2, h3, h4, b, i, span, small { color: #000 !important; }
  input, textarea { border: none !important; background: transparent !important; color: #000 !important; font-weight: bold; }
  .g6, .g3, .g { display: flex !important; flex-wrap: wrap !important; gap: 4px !important; }
  .tile { flex: 1 1 14% !important; min-width: 80px; }
  .opt { border-left: 3px solid #000 !important; }
}
</style>
</head>

</div>

<script>
const DB = JSON.parse(document.getElementById("pj-data").textContent);
DB.mod = v => Math.floor((v - 10) / 2);

const LS = {
  get: (k, def) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? def; } catch(e){ return def; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
};

let pj = LS.get("co_pj_local", null);
let curTab = "fiche";
let catalogMode = "biens";

function savePJ(){ if(pj) LS.set("co_pj_local", pj); }

function calcStats(p){
  if(!p) return null;
  const m = {};
  DB.CAR.forEach(c => {
    const total = (p.base[c] || 10) + (p.rb[c] || 0);
    m[c] = DB.mod(total);
  });
  const pr = DB.profils.find(x => x.id === p.profil) || {};
  const rc = DB.races.find(x => x.id === p.race) || {};
  const arm = DB.armures.find(a => a.n === p.arm && a.t === "Corps");
  const bou = DB.armures.find(a => a.n === p.bou && a.t === "Bouclier");

  const def = 10 + m.DEX + (arm ? arm.def : 0) + (bou ? bou.def : 0) + (rc.defb || 0) + (p.bonus?.def || 0);
  const init = ((p.base.DEX || 10) + (p.rb.DEX || 0)) + (p.bonus?.init || 0);
  const ct = p.level + m.FOR;
  const di = p.level + m.DEX;
  const mg = pr.mag ? (p.level + m[pr.mag]) : null;

  // Calcul Points de Mana Max (Option Compagnon CO : Niveau x 2 + Mod. Magie)
  const pmCalculated = pr.mag ? Math.max(1, p.level * 2 + (m[pr.mag] || 0)) : 0;
  const pmMax = (p.pmMaxManual !== null && p.pmMaxManual !== undefined) ? p.pmMaxManual : pmCalculated;

  // Déplacement officiel : 10 mètres par action de mouvement (20 m au pas de course)
  let moveBase = 10;
  if(p.profil === "moine") moveBase += 5; // Bonus voie du vent moine
  const deplacement = (p.moveBonus || 0) + moveBase;

  return { m, def, init, ct, di, mg, mag: pr.mag, hpMax: (p.hpMaxManual ?? p.hpMaxAuto) + (p.bonus?.pv || 0), pmMax, deplacement };
}

const TABS = [
  ["fiche","Héros","🛡️"],
  ["voies","Voies","🌳"],
  ["sorts","Grimoire","✨"],
  ["sac","Sac & Matériel","🎒"]
];

function renderNav(){
  document.getElementById("nav").innerHTML = TABS.map(([k,l,i]) => `
    <button class="${k === curTab ? "on" : ""}" onclick="switchTab('${k}')">
      <span>${i}</span>${l}
    </button>
  `).join("");
}

function switchTab(t){
  curTab = t;
  renderNav();
  const m = document.getElementById("main");
  if(t === "fiche") m.innerHTML = viewFiche();
  else if(t === "voies") m.innerHTML = viewVoies();
  else if(t === "sorts") m.innerHTML = viewSorts();
  else if(t === "sac") m.innerHTML = viewSac();
  window.scrollTo(0,0);
}

/* ==================== VUE 1 : FICHE DU HÉROS ==================== */
function viewFiche(){
  if(!pj) return viewWelcome();
  const st = calcStats(pj);
  const pr = DB.profils.find(x => x.id === pj.profil) || { n: pj.profil };
  const rc = DB.races.find(x => x.id === pj.race) || { n: pj.race };

  // Santé
  const hpPct = Math.max(0, Math.min(100, Math.round(100 * pj.hp / Math.max(1, st.hpMax))));
  const hpCol = hpPct > 50 ? "var(--ok)" : hpPct > 25 ? "var(--accent)" : "var(--ko)";

  // Mana
  pj.pm = pj.pm !== undefined ? pj.pm : st.pmMax;
  const pmPct = st.pmMax > 0 ? Math.max(0, Math.min(100, Math.round(100 * pj.pm / st.pmMax))) : 0;

  // Récupération des sorts & capacités pour l'accès direct en page 1
  const allSpells = getHeroSpells();

  return `
    <div class="hero">
      <div class="row sp">
        <div>
          <h2>${escapeHTML(pj.name)}</h2>
          <span class="mu">${escapeHTML(rc.n)} • ${escapeHTML(pr.n)} • Niveau ${pj.level}</span>
        </div>
        <div class="row no-print">
          <button class="b sm gold" onclick="window.print()">🖨️ Imprimer la Fiche</button>
          <button class="b sm" onclick="openLevelUpModal()">⬆️ Niveau Supérieur</button>
        </div>
      </div>
    </div>

    <!-- JAUGE DE VIE (PV) -->
    <div class="card">
      <div class="row sp">
        <h3 style="margin:0">Points de Vie (PV)</h3>
        <div class="row">
          <label style="margin:0">Actuel :</label>
          <input type="number" value="${pj.hp}" min="0" max="${st.hpMax}" style="width:65px;text-align:center;font-weight:700" onchange="setHpDirect(this.value)">
          <span style="font-weight:700">/</span>
          <input type="number" value="${st.hpMax}" min="1" title="Modifier le PV Max" style="width:65px;text-align:center;color:var(--gold2);font-weight:700" onchange="setHpMax(this.value)">
        </div>
      </div>
      <div class="v-zone">
        <div class="v-bar"><div style="width:${hpPct}%;background:${hpCol}"></div></div>
        <input type="range" class="slider-ctrl no-print" min="0" max="${st.hpMax}" value="${pj.hp}" oninput="setHpDirect(this.value)">
        <div class="row sp mu" style="font-size:.72rem">
          <span>0 PV (Inconscient/Mort)</span>
          <span>${hpPct}% de vitalité</span>
          <span>${st.hpMax} PV Max</span>
        </div>
      </div>
      <div class="row no-print">
        ${[-5,-1,+1,+5].map(v => `<button class="b sm" style="flex:1" onclick="alterHp(${v})">${v>0?"+":""}${v}</button>`).join("")}
        <button class="b sm gold" onclick="alterHp(9999)">Soins Complets</button>
      </div>
    </div>

    <!-- JAUGE DE POINTS DE SORT / MANA (PM) -->
    ${st.mag ? `
      <div class="card" style="border-color:var(--mana)">
        <div class="row sp">
          <h3 style="margin:0;color:var(--mana2)">Points de Sort / Mana (PM)</h3>
          <div class="row">
            <label style="margin:0">Actuel :</label>
            <input type="number" value="${pj.pm}" min="0" max="${st.pmMax}" style="width:65px;text-align:center;font-weight:700;color:var(--mana2)" onchange="setPmDirect(this.value)">
            <span style="font-weight:700">/</span>
            <input type="number" value="${st.pmMax}" min="1" title="Modifier le PM Max" style="width:65px;text-align:center;color:var(--mana2);font-weight:700" onchange="setPmMax(this.value)">
          </div>
        </div>
        <div class="v-zone">
          <div class="v-bar"><div style="width:${pmPct}%;background:var(--mana)"></div></div>
          <input type="range" class="slider-ctrl slider-mana no-print" min="0" max="${st.pmMax}" value="${pj.pm}" oninput="setPmDirect(this.value)">
          <div class="row sp mu" style="font-size:.72rem">
            <span>0 PM (Épuisé)</span>
            <span>${pmPct}% d'énergie arcanique</span>
            <span>${st.pmMax} PM Max (Règle Compagnon)</span>
          </div>
        </div>
        <div class="row no-print">
          ${[-3,-1,+1,+3].map(v => `<button class="b sm" style="flex:1" onclick="alterPm(${v})">${v>0?"+":""}${v}</button>`).join("")}
          <button class="b sm mana-btn" onclick="alterPm(9999)">Méditation / Repos Complet</button>
        </div>
      </div>
    ` : ""}

    <!-- CARACTÉRISTIQUES -->
    <div class="card">
      <h3>Caractéristiques &amp; Modificateurs</h3>
      <div class="g6">
        ${DB.CAR.map(c => {
          const tot = (pj.base[c] || 10) + (pj.rb[c] || 0);
          const mod = DB.mod(tot);
          return `

/* Gestion PV & PM */
function alterHp(d){
  if(!pj) return;
  const st = calcStats(pj);
  pj.hp = d === 9999 ? st.hpMax : Math.max(0, Math.min(st.hpMax, pj.hp + d));
  savePJ(); switchTab("fiche");
}
function setHpDirect(v){
  if(!pj) return;
  const st = calcStats(pj), n = parseInt(v);
  if(!isNaN(n)) pj.hp = Math.max(0, Math.min(st.hpMax, n));
  savePJ(); switchTab("fiche");
}
function setHpMax(v){
  if(!pj) return;
  const n = parseInt(v);
  if(!isNaN(n) && n > 0){ pj.hpMaxManual = n; pj.hp = Math.min(pj.hp, n); savePJ(); switchTab("fiche"); }
}

function alterPm(d){
  if(!pj) return;
  const st = calcStats(pj);
  pj.pm = d === 9999 ? st.pmMax : Math.max(0, Math.min(st.pmMax, (pj.pm || 0) + d));
  savePJ(); switchTab("fiche");
}
function setPmDirect(v){
  if(!pj) return;
  const st = calcStats(pj), n = parseInt(v);
  if(!isNaN(n)) pj.pm = Math.max(0, Math.min(st.pmMax, n));
  savePJ(); switchTab("fiche");
}
function setPmMax(v){
  if(!pj) return;
  const n = parseInt(v);
  if(!isNaN(n) && n >= 0){ pj.pmMaxManual = n; pj.pm = Math.min(pj.pm || 0, n); savePJ(); switchTab("fiche"); }
}

function castSpellWithMana(cost, name){
  if(!pj) return;
  if((pj.pm || 0) < cost){
    alert("Pas assez de Points de Mana pour lancer ce sort !");
    return;
  }
  pj.pm -= cost;
  savePJ();
  switchTab("fiche");
  // Permet de lancer le même sort plusieurs fois !
  alert(`✨ ${name} lancé avec succès ! (-${cost} PM, restant : ${pj.pm} PM)`);
}

function updateCarac(c, v){
  if(!pj) return;
  const n = parseInt(v);
  if(!isNaN(n)){ pj.base[c] = n - (pj.rb[c] || 0); savePJ(); switchTab("fiche"); }
}

/* ==================== VUE 2 : VOIES ==================== */
function viewVoies(){
  if(!pj) return viewWelcome();
  return `
    <div class="card">
      <div class="row sp">
        <h3 style="margin:0">Arbre des Voies Héroïques</h3>
        <span class="mu">Niveau <b>${pj.level}</b> • Pts disponibles : <b>${pj.ptsCap || 0}</b></span>
      </div>
      <p class="mu" style="margin-top:6px">Vos voies de classe sont auréolées d'or. Cliquez sur un rang pour l'acquérir.</p>
    </div>

    ${Object.entries(DB.voies).map(([wKey, way]) => {
      const isFav = (way.profil === pj.profil) || (way.profil === "race:" + pj.race);
      const myRank = pj.caps.reduce((max, c) => c.wayKey === wKey ? Math.max(max, c.rank) : max, 0);

      return `
        <details class="${isFav ? "active-way" : ""}" ${isFav ? "open" : ""}>
          <summary>
            ${isFav ? "⭐ " : ""}${escapeHTML(way.nom)}
            <span class="mu" style="font-weight:400;font-size:.8rem">(${escapeHTML(way.profil)}) • Rang : ${myRank}/5</span>
          </summary>
          <div class="chain" style="padding:0 12px 12px">
            ${way.r.map((rk, idx) => {
              const rankNum = idx + 1;
              const hasRank = myRank >= rankNum;
              const isNext = (myRank === rankNum - 1);
              const cost = rankNum <= 2 ? 1 : 2;
              const canAfford = (pj.ptsCap || 0) >= cost;

              let statusCls = "lock", badge = "Verrouillé";
              if(hasRank){ statusCls = "have"; badge = "Acquis ✓"; }
              else if(isNext){ statusCls = "next"; badge = canAfford ? `Accessible (${cost} pt)` : `Points requis (${cost} pt)`; }

              return `
                <div class="rk ${statusCls}">
                  <i>${rankNum}</i>
                  <div style="flex:1">
                    <div class="row sp">
                      <b style="color:var(--gold2)">${escapeHTML(rk.n)}</b>
                      <div>
                        ${rk.L ? `<span class="tag tag-l">Limitée</span>` : ""}
                        ${rk.S ? `<span class="tag tag-s">Sort</span>` : ""}
                        <span class="mu" style="font-size:.7rem">${badge}</span>
                      </div>
                    </div>
                    <p style="font-size:.82rem;margin-top:3px">${escapeHTML(rk.t)}</p>
                    ${isNext && canAfford ? `
                      <button class="b sm gold" style="margin-top:6px" onclick="learnRank('${wKey}', ${rankNum}, ${cost})">
                        Débloquer le Rang ${rankNum} (-${cost} pt)
                      </button>
                    ` : ""}
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        </details>
      `;
    }).join("")}
  `;
}

function learnRank(wKey, rankNum, cost){
  if(!pj || (pj.ptsCap || 0) < cost) return;
  pj.ptsCap -= cost;
  pj.caps.push({ wayKey: wKey, rank: rankNum });
  savePJ(); switchTab("voies");
}

/* ==================== VUE 3 : GRIMOIRE & SORTS ==================== */
function getHeroSpells(){
  if(!pj) return [];
  pj.customSorts = pj.customSorts || [];
  const list = [];
  pj.caps.forEach(c => {
    const v = DB.voies[c.wayKey];
    if(v && v.r && v.r[c.rank - 1]){
      const rk = v.r[c.rank - 1];
      if(rk.S){
        list.push({ id: `${c.wayKey}_${c.rank}`, n: rk.n, voie: v.nom, rang: c.rank, t: rk.t, portee: "30 m", L: rk.L });
      }
    }
  });
  pj.customSorts.forEach((cs, i) => {
    list.push({ id: `cust_${i}`, n: cs.n, voie: cs.voie || "Personnalisé", rang: cs.rang || 1, t: cs.t, portee: cs.portee || "Contact", L: 1 });
  });
  return list;
}

function setItemQtyDirect(idx, val){
  const q = parseInt(val);
  if(isNaN(q) || q < 0) return switchTab("sac");
  if(q === 0){
    if(confirm(`La quantité est à zéro. Supprimer complètement "${pj.inventaire[idx].n}" ?`)){
      pj.inventaire.splice(idx, 1);
    } else {
      pj.inventaire[idx].q = 0;
    }
  } else {
    pj.inventaire[idx].q = q;
  }
  savePJ(); switchTab("sac");
}

function updateItemNote(idx, val){
  pj.inventaire[idx].note = val;
  savePJ();
}

function alterItemQty(idx, delta){
  const it = pj.inventaire[idx];
  it.q = (it.q || 1) + delta;
  if(it.q <= 0){
    if(confirm(`Supprimer "${it.n}" de l'inventaire ?`)){
      pj.inventaire.splice(idx,1);
    } else {
      it.q = 0;
    }
  }
  savePJ(); switchTab("sac");
}

    q: parseInt(document.getElementById("man-q").value) || 1,
    isConsumable: document.getElementById("man-c").value === "1",
    desc: document.getElementById("man-d").value.trim(),
    note: document.getElementById("man-note").value.trim()
  });
  savePJ(); closeModal(); switchTab("sac");
}

function removeWeapon(idx){ pj.armes.splice(idx,1); savePJ(); switchTab("sac"); }
function removeItem(idx){ pj.inventaire.splice(idx,1); savePJ(); switchTab("sac"); }

function openDrawer(mode){
  catalogMode = mode;
  document.getElementById("dr-title").textContent =
    mode === "armes" ? "Armurerie" : mode === "armures" ? "Protections" : mode === "sorts" ? "Catalogue des Sorts" : "Catalogue Matériel";
  document.getElementById("drawer").classList.add("open");
  drawCatalog();
}
function closeDrawer(){ document.getElementById("drawer").classList.remove("open"); }

function drawCatalog(){
  const q = (document.getElementById("dr-q").value || "").toLowerCase();
  const body = document.getElementById("dr-body");

  if(catalogMode === "sorts"){
    const filteredSpells = DB.sortsCatalogue.filter(s => (s.n + s.t + s.voie).toLowerCase().includes(q));
    body.innerHTML = filteredSpells.map(s => `
      <div class="opt">
        <div class="row sp">
          <b style="color:#d9c2ff">${escapeHTML(s.n)}</b>
          <button class="b sm purple" onclick='learnSpellFromCatalog(${JSON.stringify(s).replace(/'/g, "&apos;")})'>+ Apprendre</button>
        </div>
        <div class="mu" style="font-size:.78rem;margin-top:2px">
          Rang <b>${s.rang}</b> • Voie : ${escapeHTML(s.voie)} • Portée : ${escapeHTML(s.portee)}<br>
          ${escapeHTML(s.t)}
        </div>
      </div>
    `).join("") || `<p class="mu">Aucun sort trouvé.</p>`;
    return;
  }

  let items = catalogMode === "biens" ? DB.biens : catalogMode === "armes" ? DB.armes : DB.armures;
  const filtered = items.filter(it => (it.n + (it.desc || it.props || "")).toLowerCase().includes(q));

  body.innerHTML = filtered.map(it => `
    <div class="opt">
      <div class="row sp">
        <b style="color:var(--gold2)">${escapeHTML(it.n)}</b>
        <button class="b sm gold" onclick='selectFromDrawer(${JSON.stringify(it).replace(/'/g, "&apos;")})'>+ Sélectionner</button>
      </div>
      <div class="mu" style="font-size:.78rem;margin-top:3px">
        ${it.isPack ? `<span class="tag tag-pack">Pack Complet</span>` : ""}
        ${it.dm ? `Dégâts : <b>${it.dm}</b> • Portée : ${it.por} • Crit : ${it.crit}<br>` : ""}
        ${it.def ? `Protection : <b>+${it.def} DEF</b><br>` : ""}
        ${it.props ? `Propriétés : ${escapeHTML(it.props)}<br>` : ""}
        ${it.desc ? `${escapeHTML(it.desc)}` : ""}
      </div>
    </div>
  `).join("") || `<p class="mu">Aucun élément trouvé.</p>`;
}

function learnSpellFromCatalog(spell){
  if(!pj) return;
  pj.customSorts = pj.customSorts || [];
  if(pj.customSorts.some(s => s.n.toLowerCase() === spell.n.toLowerCase())){
    alert("Vous connaissez déjà ce sortilège !");
    return;
  }
  pj.customSorts.push({
    n: spell.n,
    rang: spell.rang,
    voie: spell.voie,
    portee: spell.portee,
    t: spell.t
  });
  savePJ();
  closeDrawer();
  switchTab("sorts");
  alert(`✨ ${spell.n} ajouté à votre Grimoire !`);
}

function selectFromDrawer(item){
  if(!pj) return;
  if(catalogMode === "armes"){
    (pj.armes = pj.armes || []).push({ ...item, note: "" });
  } else if(catalogMode === "armures"){
    if(item.t === "Bouclier") pj.bou = item.n; else pj.arm = item.n;
  } else {
    pj.inventaire = pj.inventaire || [];
    if(item.isPack){
      const packElements = [
        { n: "Sac à dos renforcé", q: 1, desc: "Toile imperméabilisée", note: "Rangement principal" },
        { n: "Corde (15 m) & grappin", q: 1, desc: "Chanvre solide avec crochet d'acier", note: "Fixée sous le sac" },
        { n: "Paillasse portable & couverture", q: 1, desc: "Couchage rembourré et couverture chaude", note: "Roulée sur le sac" },
        { n: "Torches de résine", q: 5, desc: "1h d'éclairage à 10 m", isConsumable: true, note: "Plein d'amadou" },
        { n: "Briquet à silex et amadou", q: 1, desc: "Allume un feu rapidement", note: "Poche étanche" },
        { n: "Rations de voyage (1 sem.)", q: 7, desc: "Vivres de longue conservation", isConsumable: true, note: "1 portion par jour" },
        { n: "Gourde d'eau en cuir (1L)", q: 1, desc: "Pleine d'eau fraîche", isConsumable: true, note: "Ceinture" },
        { n: "Potion de soins légers", q: 1, desc: "Rend immédiatement 1d8 PV", isConsumable: true, note: "Accès d'urgence" }
      ];
      packElements.forEach(pItem => {
        const exist = pj.inventaire.find(x => x.n === pItem.n);
        if(exist) exist.q = (exist.q || 1) + pItem.q;
        else pj.inventaire.push(pItem);
      });
      alert("Le Pack d'Aventurier a été ajouté et déballé dans votre sac !");
    } else {
      const exist = pj.inventaire.find(x => x.n === item.n);
      if(exist) exist.q = (exist.q || 1) + (item.q || 1);
      else pj.inventaire.push({ n: item.n, desc: item.desc || "", q: item.q || 1, isConsumable: !!item.isConsumable, note: "" });
    }
  }
  savePJ(); closeDrawer(); switchTab("sac");
}

function openLevelUpModal(){
  if(!pj) return;
  const pr = DB.profils.find(x => x.id === pj.profil) || { dv: 8 };
  const st = calcStats(pj);
  const modCon = st.m.CON;

  document.getElementById("mh").textContent = `Passage au Niveau ${pj.level + 1}`;
  document.getElementById("pg").innerHTML = "";
  document.getElementById("mb").innerHTML = `
    <p>Munissez-vous de votre véritable <b>dé physique à ${pr.dv} faces (d${pr.dv})</b> et lancez-le !</p>
    <div style="margin:14px 0">
      <label>Résultat exact obtenu sur le d${pr.dv} :</label>
      <input type="number" id="dice-irl" min="1" max="${pr.dv}" value="${Math.ceil(pr.dv/2)}" style="font-size:1.5rem;text-align:center;color:var(--gold2);font-weight:700">
    </div>
    <div class="opt">
      <div>Modificateur de Constitution appliqué : <b>${modCon >= 0 ? "+" : ""}${modCon}</b></div>
      <div class="mu" style="font-size:.75rem">Minimum garanti par niveau : +1 PV.</div>
    </div>
    <p class="mu">+2 points de capacités vous seront également accordés.</p>
  `;
  document.getElementById("mf").innerHTML = `
    <button class="b" onclick="closeModal()">Annuler</button>
    <button class="b gold" onclick="confirmLevelUp(${pr.dv}, ${modCon})">Valider le niveau</button>
  `;
  document.getElementById("ov").classList.add("on");
}

function confirmLevelUp(dv, modCon){
  const roll = parseInt(document.getElementById("dice-irl").value) || 1;
  const gainedHp = Math.max(1, roll + modCon);

  pj.level += 1;
  pj.hpMaxAuto = (pj.hpMaxAuto || pj.hpBase || 10) + gainedHp;
  if(pj.hpMaxManual) pj.hpMaxManual += gainedHp;
  pj.hp += gainedHp;
  pj.ptsCap = (pj.ptsCap || 0) + 2;

  // Calcul auto PM
  const st = calcStats(pj);
  pj.pm = st.pmMax;

  savePJ(); closeModal(); switchTab("fiche");
  alert(`Félicitations ! Vous passez niveau ${pj.level}. +${gainedHp} PV ajoutés (d${dv} = ${roll} & CON = ${modCon}).`);
}

function closeModal(){ document.getElementById("ov").classList.remove("on"); }

let w = null;
const WS = ["Identité","Race","Profil","Caractéristiques","Capacités de départ","Équipement","Confirmation"];

function openWizard(){
  w = {
    s: 0, name: "", player: "", race: "humain", rcOption: 0, profil: "barbare",
    base: { FOR:10, DEX:10, CON:10, INT:10, SAG:10, CHA:10 }, rb: {}, selCaps: []
  };
  const r = DB.races.find(x => x.id === w.race);
  if(r) w.rb = { ...r.b };
  drawWizard();
  document.getElementById("ov").classList.add("on");
}

function drawWizard(){
  document.getElementById("mh").textContent = `Étape ${w.s + 1}/7 · ${WS[w.s]}`;
  document.getElementById("pg").innerHTML = `<div class="prog"><div style="width:${(w.s+1)/7*100}%"></div></div>`;
  let h = "";

  if(w.s === 0){
    h = `
      <label>Nom du Héros *</label>
      <input id="wn" value="${escapeHTML(w.name)}" placeholder="Ex: Sire Thomas, Grommash...">
      <label>Nom du Joueur</label>
      <input id="wp" value="${escapeHTML(w.player)}" placeholder="Ex: Julien...">
    `;
  }
  else if(w.s === 1){
    h = DB.races.map(r => `
      <div class="opt ${w.race === r.id ? "sel" : ""}" onclick="wPickRace('${r.id}')">
        <b>${escapeHTML(r.n)}</b> <span class="ok">${escapeHTML(r.t)}</span>
        <p class="mu">${escapeHTML(r.d)}</p>
        ${w.race === r.id ? `
          <div style="margin-top:6px">
            ${r.cap.map(c => `<p>• <b>${escapeHTML(c.n)} :</b> ${escapeHTML(c.t)}</p>`).join("")}
            ${r.opts ? r.opts.map((o, idx) => `
              <div class="opt ${w.rcOption === idx ? "sel" : ""}" style="margin:4px 0" onclick="event.stopPropagation(); w.rcOption=${idx}; drawWizard()">
                <b>Option : ${escapeHTML(o.n)}</b>
                <p class="mu" style="font-size:.75rem">${escapeHTML(o.t)}</p>
              </div>
            `).join("") : ""}
          </div>
        ` : ""}
      </div>
    `).join("");
  }
  else if(w.s === 2){
    h = DB.profils.map(p => `
      <div class="opt ${w.profil === p.id ? "sel" : ""}" onclick="w.profil='${p.id}'; w.selCaps=[]; drawWizard()">
        <b>${escapeHTML(p.n)}</b> <span class="mu">Dé de vie d${p.dv}${p.mag ? " · Magie: "+p.mag : ""}</span>
        <p class="mu" style="margin-top:4px"><b>Équipement :</b> ${escapeHTML(p.eq)}</p>
        <p class="mu"><b>Armes &amp; armures :</b> ${escapeHTML(p.ar)}</p>
      </div>
    `).join("");
  }
  else if(w.s === 3){
    h = `
      <p class="mu" style="margin-bottom:8px">Méthode par répartition : 6 points de modificateurs à répartir (0 à +4 par carac.), 3 scores pairs et 3 impairs, maximum 18 avant bonus raciaux.</p>
      <div class="g3">
        ${DB.CAR.map(c => `
          <div>
            <label>${c} (Base)</label>
            <input type="number" min="3" max="18" value="${w.base[c]}" oninput="wUpdateStat('${c}', this.value)" style="text-align:center;font-weight:700">
            <div id="stat-lbl-${c}" class="ok" style="font-size:.75rem;text-align:center">${wFormatStat(c)}</div>
          </div>
        `).join("")}
      </div>
      <div id="chk-msg" style="margin-top:8px">${wCheckRules()}</div>
    `;
  }
  else if(w.s === 4){
    const availWays = Object.entries(DB.voies).filter(([k,v]) => v.profil === w.profil || v.profil === "race:" + w.race);
    h = `
      <p style="margin-bottom:8px">Choisissez <b>2 capacités de Rang 1</b> (${w.selCaps.length}/2 sélectionnées) :</p>
      ${availWays.map(([k,v]) => {
        const r1 = v.r && v.r[0] ? v.r[0] : { n: "Rang 1", t: "Description" };
        const isSelected = w.selCaps.includes(k);
        return `
          <div class="opt ${isSelected ? "sel" : ""}" onclick="wToggleCap('${k}')">
            <span class="mu">${escapeHTML(v.nom)}</span><br>
            <b style="color:var(--gold2)">${escapeHTML(r1.n)}</b>
            <p class="mu" style="font-size:.8rem;margin-top:2px">${escapeHTML(r1.t)}</p>
          </div>
        `;
      }).join("")}
    `;
  }
  else if(w.s === 5){
    const pObj = DB.profils.find(x => x.id === w.profil);
    h = `
      <label>Inventaire &amp; équipement de départ :</label>
      <textarea id="w-gear" rows="5">${escapeHTML(w.gear || pObj.eq)}</textarea>
    `;
  }
  else if(w.s === 6){
    const rObj = DB.races.find(x => x.id === w.race);
    const pObj = DB.profils.find(x => x.id === w.profil);
    const hpInit = pObj.dv + DB.mod(w.base.CON + (w.rb.CON || 0));
    h = `
      <h3 style="color:var(--gold)">${escapeHTML(w.name || "Aventurier")}</h3>
      <p><b>${escapeHTML(rObj.n)}</b> • <b>${escapeHTML(pObj.n)}</b> • Niveau 1</p>
      <div class="opt" style="margin-top:8px">
        <p><b>Points de vie initiaux :</b> ${hpInit} PV (d${pObj.dv} max + CON)</p>
        <p><b>Défense :</b> ${10 + DB.mod(w.base.DEX + (w.rb.DEX || 0)) + (rObj.defb || 0)}</p>
        <p><b>Déplacement de base :</b> 10 m par action</p>
        <p><b>Capacités choisies :</b> ${w.selCaps.map(k => DB.voies[k].r[0].n).join(", ") || "Aucune"}</p>
      </div>
    `;
  }

  document.getElementById("mb").innerHTML = h;
  document.getElementById("mf").innerHTML = `
    ${w.s > 0 ? `<button class="b" onclick="wNav(-1)">← Précédent</button>` : `<button class="b" onclick="closeModal()">Annuler</button>`}
    <button class="b gold" style="flex:2" onclick="wNav(1)">${w.s === 6 ? "✓ Créer le Personnage" : "Continuer →"}</button>
  `;
}

function wPickRace(id){
  w.race = id;
  const r = DB.races.find(x => x.id === id);
  w.rb = { ...r.b };
  w.rcOption = 0;
  drawWizard();
}

function wFormatStat(c){
  const tot = w.base[c] + (w.rb[c] || 0);
  const m = DB.mod(tot);
  return `${tot} (${m >= 0 ? "+" : ""}${m})${w.rb[c] ? " [race "+(w.rb[c]>0?"+":"")+w.rb[c]+"]" : ""}`;
}

function wUpdateStat(c, v){
  w.base[c] = parseInt(v) || 10;
  document.getElementById(`stat-lbl-${c}`).textContent = wFormatStat(c);
  document.getElementById("chk-msg").innerHTML = wCheckRules();
}

function wCheckRules(){
  const mods = DB.CAR.map(c => DB.mod(w.base[c]));
  const sum = mods.reduce((a,b) => a+b, 0);
  const pairs = DB.CAR.map(c => w.base[c]).filter(v => v % 2 === 0).length;
  const errs = [];
  if(sum !== 6) errs.push(`Somme des Modificateurs = ${sum} (Attendu : 6)`);
  if(pairs !== 3) errs.push(`Valeurs paires de base : ${pairs}/3`);
  return errs.length ? `<span class="wn">⚠ ${errs.join(" · ")}</span>` : `<span class="ok">✓ Répartition standard conforme</span>`;
}

function wToggleCap(k){
  const idx = w.selCaps.indexOf(k);
  if(idx >= 0) w.selCaps.splice(idx, 1);
  else if(w.selCaps.length < 2) w.selCaps.push(k);
  drawWizard();
}

function wNav(dir){
  if(dir > 0){
    if(w.s === 0){
      w.name = document.getElementById("wn").value.trim();
      w.player = document.getElementById("wp").value.trim();
      if(!w.name) return alert("Donnez un nom à votre héros.");
    }
    if(w.s === 4){
      const availWays = Object.entries(DB.voies).filter(([k,v]) => v.profil === w.profil || v.profil === "race:" + w.race);
      if(availWays.length >= 2 && w.selCaps.length < 2){
        if(!confirm("Vous n'avez pas sélectionné vos 2 capacités de rang 1. Voulez-vous continuer quand même ?")){
          return;
        }
      }
    }
    if(w.s === 5){ w.gear = document.getElementById("w-gear").value; }
    if(w.s === 6){ finalizeHero(); return; }
  }
  w.s += dir;
  drawWizard();
}

function finalizeHero(){
  const rObj = DB.races.find(x => x.id === w.race);
  const pObj = DB.profils.find(x => x.id === w.profil);
  const hpInit = pObj.dv + DB.mod(w.base.CON + (w.rb.CON || 0));

  pj = {
    version: "1.0",
    name: w.name,
    player: w.player,
    race: w.race,
    rcOption: w.rcOption,
    profil: w.profil,
    level: 1,
    base: { ...w.base },
    rb: { ...w.rb },
    hpBase: hpInit,
    hpMaxAuto: hpInit,
    hpMaxManual: null,
    hp: hpInit,
    pmMaxManual: null,
    pm: null,
    ptsCap: 0,
    caps: w.selCaps.map(k => ({ wayKey: k, rank: 1 })),
    armes: [{ n: "Dague", t: "Contact", dm: "1d4", crit: "20", por: "5 m", note: "" }],
    inventaire: [
      { n: "Sac à dos renforcé", q: 1, desc: "Toile imperméable", note: w.gear || pObj.eq }
    ],
    customSorts: [],
    arm: "",
    bou: "",
    bonus: { pv:0, def:0, init:0 },
    persoTraits: ""
  };

  const st = calcStats(pj);
  pj.pm = st.pmMax;

  savePJ(); closeModal(); switchTab("fiche");
}

function exportHero(){
  if(!pj) return;
  const a = document.createElement("a");
  a.href = "data:application/json;charset=utf-8," + encodeURIComponent(JSON.stringify(pj, null, 2));
  a.download = (pj.name || "personnage").replace(/\s+/g,"_") + "_CO.json";
  a.click();
}

function importHero(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if(!data.name || !data.base) throw new Error("Format JSON non valide.");
      pj = data; savePJ(); switchTab("fiche");
      alert(`Héros "${pj.name}" importé avec succès !`);
    } catch(err){ alert("Erreur lors de l'import : " + err.message); }
  };
  reader.readAsText(file);
}

function escapeHTML(str){
  return String(str ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

renderNav();
switchTab(pj ? "fiche" : "fiche");
</script>
</body>
</html>
