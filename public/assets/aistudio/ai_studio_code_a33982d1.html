<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chroniques Oubliées – Console MJ Pro (Filtres & Recherche)</title>
<style>
:root{
  --bg:#0f0d0b;--p:#181410;--p2:#231c15;--p3:#2d241c;--ln:#3d3023;
  --gold:#d4a84a;--gold2:#f3d48d;--red:#9c2a2b;--tx:#ede3d1;--mu:#9e907d;
  --ok:#6fa85b;--ko:#cf5544;--accent:#c97d32;--sp:#7c5ebb;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5;padding-bottom:92px;font-size:14px}
h1,h2,h3,h4{font-family:Georgia,serif;font-weight:700}
header{background:linear-gradient(180deg,#341512,var(--bg));border-bottom:1px solid var(--ln);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30}
header h1{color:var(--gold);font-size:1.15rem;letter-spacing:.12em;text-transform:uppercase}
main{max-width:1200px;margin:0 auto;padding:12px}

/* NAVIGATION DÉFILANTE */
nav#nav{position:fixed;left:0;right:0;bottom:0;background:#130f0c;border-top:1px solid var(--ln);display:flex;overflow-x:auto;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40;gap:4px}
nav#nav button{flex:0 0 auto;min-width:76px;background:none;border:0;color:var(--mu);font-size:.7rem;font-weight:600;padding:5px 6px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav#nav button span{font-size:1.2rem;line-height:1}
nav#nav button.on{color:var(--gold);background:rgba(212,168,74,.18)}

.card{background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{color:var(--gold);font-size:1rem;margin-bottom:8px}
.mu{color:var(--mu);font-size:.82rem}.ok{color:var(--ok)}.ko{color:var(--ko)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
button.b{background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:6px 11px;font-weight:600;font-size:.8rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px}
button.b:hover{border-color:var(--gold)}button.gold{background:var(--gold);color:#1b1406;border-color:var(--gold)}button.red{background:var(--red);border-color:var(--red);color:#fff}button.sm{padding:3px 7px;font-size:.75rem}button.purple{background:#3a2954;border-color:#654a93;color:#dccbff}
input,select,textarea{width:100%;padding:7px 9px;background:var(--p2);border:1px solid var(--ln);color:var(--tx);border-radius:6px;font-size:.88rem;margin:3px 0 6px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:-1px}
label{font-size:.65rem;color:var(--mu);font-weight:700;text-transform:uppercase;letter-spacing:.05em;display:block}

.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.opt{background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:10px;margin-bottom:6px}
.tag{display:inline-block;padding:2px 5px;border-radius:4px;font-size:.68rem;font-weight:600;margin-right:4px}
.tag-l{background:#632c2d;color:#ffb8b8}.tag-s{background:#2a4563;color:#b0d7ff}.tag-nc{background:#382b1b;color:#f3d48d}

.hp-bar{height:8px;background:#0c0a08;border-radius:4px;overflow:hidden;border:1px solid var(--ln);margin:4px 0}
.hp-bar div{height:100%;transition:width .2s}

details summary{padding:8px;cursor:pointer;font:700 .92rem Georgia,serif;color:var(--gold);list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"▾";float:right;color:var(--mu)}
details[open] summary::after{content:"▴"}

.init-box{display:flex;align-items:center;gap:4px;background:#15100b;padding:3px 6px;border-radius:6px;border:1px solid var(--ln)}
.init-val{width:45px;text-align:center;font-weight:700;color:var(--gold2);font-size:1rem;margin:0;padding:2px}
table{width:100%;border-collapse:collapse;font-size:.82rem}
td,th{border-bottom:1px solid var(--ln);padding:6px 5px;text-align:left;vertical-align:top}
th{color:var(--gold);font-size:.68rem;text-transform:uppercase}
.search-bar-box{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.search-bar-box input{flex:2;min-width:180px;margin:0}
.search-bar-box select{flex:1;min-width:130px;margin:0}

#drop-overlay{display:none;position:fixed;inset:0;background:rgba(20,15,10,.92);border:4px dashed var(--gold);z-index:99;align-items:center;justify-content:center;flex-direction:column;pointer-events:none}
#drop-overlay.drag-on{display:flex}
</style>
</head>
<body>

<div id="drop-overlay">
  <h2 style="color:var(--gold);font-size:1.8rem">📥 Déposez vos fichiers JSON ici</h2>
  <p class="mu" style="font-size:1rem;margin-top:8px">L'application détecte et range automatiquement le Bestiaire, les Équipements, les Règles, etc.</p>
</div>

<header>
  <div>
    <h1>Console Maître du Jeu</h1>
    <span class="mu" style="font-size:.7rem">Chroniques Oubliées – Hub de Recherche &amp; Table</span>
  </div>
  <div class="row">
    <button class="b sm gold" onclick="document.getElementById('universal-file-input').click()">📥 Déposer des JSON (Auto-détection)</button>
    <button class="b sm" onclick="saveMasterJSON()">💾 Sauvegarder Master</button>
    <button class="b sm" onclick="document.getElementById('master-imp').click()">📂 Charger Master</button>
    <input type="file" id="master-imp" hidden accept=".json" onchange="loadMasterJSON(event)">
    <input type="file" id="universal-file-input" hidden multiple accept=".json" onchange="handleFiles(this.files)">
  </div>
</header>

<main id="main"></main>
<nav id="nav"></nav>

<script>
const LS = {
  get: (k, def) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? def; } catch(e){ return def; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
};

/* ==================== BASE DE DONNÉES GLOBALE DU DRS ==================== */
let tableData = LS.get("co_mj_table", {
  pjs: [],
  combatants: [],
  bestiaire: [],
  equipements: [],
  regles: [],
  etats: [],
  races: [],
  profils: [],
  voies: [],
  sorts: []
});

let curTab = "combat";
function saveState(){ LS.set("co_mj_table", tableData); }

/* ==================== MOTEUR D'INGESTION UNIVERSEL ==================== */
function ingestData(data, filename = ""){
  let log = [];
  if(!data) return log;

  // 1. Fiche PJ
  if(data.name && (data.base || data.profil || data.level !== undefined)){
    const i = tableData.pjs.findIndex(p => p.name.toLowerCase() === data.name.toLowerCase());
    if(i >= 0) tableData.pjs[i] = data; else tableData.pjs.push(data);
    log.push(`PJ : ${data.name}`);
    return log;
  }

  // 2. Tableaux
  if(Array.isArray(data)){
    if(!data.length) return log;
    if(data[0].nc !== undefined){
      tableData.bestiaire = data;
      log.push(`${data.length} créatures (Bestiaire)`);
    } else if(data[0].prix !== undefined){
      tableData.equipements = data;
      log.push(`${data.length} objets (Équipements)`);
    } else if(data[0].voie !== undefined && data[0].rang !== undefined){
      tableData.sorts = data;
      log.push(`${data.length} sorts / capacités`);
    } else if(data[0].mod !== undefined){
      tableData.races = data;
      log.push(`${data.length} races`);
    } else if(data[0].dv !== undefined){
      tableData.profils = data;
      log.push(`${data.length} profils`);
    }
    return log;
  }

  // 3. Objets avec clés
  if(typeof data === "object"){
    if(Array.isArray(data.bestiaire)){ tableData.bestiaire = data.bestiaire; log.push(`${data.bestiaire.length} monstres`); }
    if(Array.isArray(data.equipements || data.biens)){
      const eq = data.equipements || data.biens;
      tableData.equipements = eq; log.push(`${eq.length} équipements`);
    }
    if(Array.isArray(data.regles)){ tableData.regles = data.regles; log.push(`${data.regles.length} règles`); }
    if(Array.isArray(data.etats)){ tableData.etats = data.etats; log.push(`${data.etats.length} états`); }
    if(Array.isArray(data.races)){ tableData.races = data.races; log.push(`${data.races.length} races`); }
    if(Array.isArray(data.profils)){ tableData.profils = data.profils; log.push(`${data.profils.length} profils`); }
    if(Array.isArray(data.voies)){ tableData.voies = data.voies; log.push(`${data.voies.length} voies`); }
    if(Array.isArray(data.sorts)){ tableData.sorts = data.sorts; log.push(`${data.sorts.length} sorts`); }
    if(Array.isArray(data.pjs)){ tableData.pjs = data.pjs; log.push(`${data.pjs.length} PJ`); }
    if(Array.isArray(data.combatants)){ tableData.combatants = data.combatants; }
  }

  return log;
}

function handleFiles(files){
  if(!files || !files.length) return;
  let totalLogs = [], pending = files.length;
  Array.from(files).forEach(f => {
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const parsed = JSON.parse(ev.target.result);
        const l = ingestData(parsed, f.name);
        if(l.length) totalLogs.push(...l);
      } catch(e){ console.error("Erreur JSON " + f.name, e); }
      pending--;
      if(pending === 0){
        saveState();
        switchTab(curTab);
        if(totalLogs.length) alert("✅ Données enregistrées avec succès :\n• " + totalLogs.join("\n• "));
        else alert("Fichier JSON non reconnu ou vide.");
      }
    };
    reader.readAsText(f);
  });
}

/* Glisser-déposer global */
window.addEventListener("dragover", e => { e.preventDefault(); document.getElementById("drop-overlay").classList.add("drag-on"); });
window.addEventListener("dragleave", e => { if(e.clientX <= 0 || e.clientY <= 0) document.getElementById("drop-overlay").classList.remove("drag-on"); });
window.addEventListener("drop", e => {
  e.preventDefault();
  document.getElementById("drop-overlay").classList.remove("drag-on");
  if(e.dataTransfer && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
});

/* ==================== NAVIGATION ==================== */
const TABS = [
  ["combat", "Combat & Init", "⚔️"],
  ["groupe", "Groupe PJ", "👥"],
  ["bestiaire", "Bestiaire", "🐉"],
  ["equipements", "Équipements", "💰"],
  ["regles", "Règles", "📜"],
  ["races", "Races", "🧝"],
  ["profils", "Profils", "🛡️"],
  ["voies", "Voies", "🌳"],
  ["capacites", "Capacités", "⚡"],
  ["grimoire", "Grimoire", "✨"]
];

function renderNav(){
  document.getElementById("nav").innerHTML = TABS.map(([k,l,i]) => `
    <button class="${k === curTab ? "on" : ""}" onclick="switchTab('${k}')">
      <span>${i}</span>${l}
    </button>
  `).join("");
}

function switchTab(t){
  curTab = t; renderNav();
  const m = document.getElementById("main");
  if(t === "combat") { m.innerHTML = viewCombat(); filterCombat(); }
  else if(t === "groupe") { m.innerHTML = viewGroupe(); filterGroupe(); }
  else if(t === "bestiaire") { m.innerHTML = viewBestiaire(); filterBestiaire(); }
  else if(t === "equipements") { m.innerHTML = viewEquipements(); filterEquipements(); }
  else if(t === "regles") { m.innerHTML = viewRegles(); filterRegles(); }
  else if(t === "races") { m.innerHTML = viewRaces(); filterRaces(); }
  else if(t === "profils") { m.innerHTML = viewProfils(); filterProfils(); }
  else if(t === "voies") { m.innerHTML = viewVoies(); filterVoies(); }
  else if(t === "capacites") { m.innerHTML = viewCapacites(); filterCapacites(); }
  else if(t === "grimoire") { m.innerHTML = viewGrimoire(); filterGrimoire(); }
  window.scrollTo(0,0);
}

/* ==================== 1. COMBAT & INIT ==================== */
function viewCombat(){
  return `
    <div class="card">
      <div class="row sp">
        <div>
          <h3 style="margin:0">Piste de Combat &amp; Initiatives</h3>
          <span class="mu">Total engagés : <b id="cmb-count">${tableData.combatants.length}</b></span>
        </div>
        <div class="row">
          <button class="b sm gold" onclick="rollAllInit()">🎲 Lancer TOUT (d20+Base)</button>
          <button class="b sm purple" onclick="rollMonstersInit()">🎲 Lancer Monstres</button>
          <button class="b sm" onclick="sortCombatants()">⚡ Trier</button>
          <button class="b sm red" onclick="clearCombat()">✕ Vider</button>
        </div>
      </div>
      <div class="search-bar-box">
        <input id="cmb-q" placeholder="Filtrer combattant par nom ou note..." oninput="filterCombat()">
        <select id="cmb-filter" onchange="filterCombat()">
          <option value="">Tous les combattants</option>
          <option value="pj">PJ uniquement</option>
          <option value="monstre">Monstres uniquement</option>
          <option value="alive">En vie (> 0 PV)</option>
          <option value="ko">Inconscients / Morts (0 PV)</option>
        </select>
        <button class="b sm" onclick="document.getElementById('cmb-q').value='';document.getElementById('cmb-filter').value='';filterCombat()">Effacer</button>
      </div>
    </div>
    <div id="cmb-list"></div>
  `;
}

function filterCombat(){
  const q = (document.getElementById("cmb-q")?.value || "").toLowerCase();
  const f = document.getElementById("cmb-filter")?.value || "";
  const target = document.getElementById("cmb-list");
  if(!target) return;

  const filtered = tableData.combatants.filter((c, i) => {
    const matchQ = (c.n + (c.notes || "")).toLowerCase().includes(q);
    let matchF = true;
    if(f === "pj") matchF = !!c.isPj;
    else if(f === "monstre") matchF = !c.isPj;
    else if(f === "alive") matchF = c.hp > 0;
    else if(f === "ko") matchF = c.hp <= 0;
    c._origIdx = i;
    return matchQ && matchF;
  });

  const countEl = document.getElementById("cmb-count");
  if(countEl) countEl.textContent = `${filtered.length} / ${tableData.combatants.length}`;

  target.innerHTML = filtered.map(c => {
    const i = c._origIdx;
    const pct = Math.max(0, Math.min(100, Math.round(100 * c.hp / Math.max(1, c.hpMax))));
    const barCol = pct > 50 ? "var(--ok)" : pct > 25 ? "var(--accent)" : "var(--ko)";
    return `
      <div class="opt" style="border-left:5px solid ${c.isPj ? "var(--gold)" : "var(--red)"}">
        <div class="row sp">
          <div>
            <b style="font-size:1.05rem;color:${c.isPj ? "var(--gold2)" : "#ff9d9d"}">${escapeHTML(c.n)}</b>
            <span class="mu">(${c.isPj ? "PJ" : "Monstre"}) • DEF : <b>${c.def}</b></span>
          </div>
          <div class="init-box">
            <label style="margin:0;font-size:.65rem">Init :</label>
            <input type="number" class="init-val" value="${c.init}" onchange="tableData.combatants[${i}].init=+this.value||0;saveState()">
            <button class="b sm" onclick="rollOneInit(${i})">🎲 Jet</button>
            ${c.lastRoll !== undefined ? `<span class="mu" style="font-size:.7rem">(d20:${c.lastRoll})</span>` : ""}
          </div>
        </div>
        <div style="margin:6px 0">
          <div class="row sp">
            <span>PV : <b>${c.hp} / ${c.hpMax}</b></span>
            <div class="row">
              <button class="b sm" onclick="alterCombatHp(${i},-5)">-5</button>
              <button class="b sm" onclick="alterCombatHp(${i},-1)">-1</button>
              <input type="number" value="${c.hp}" style="width:50px;text-align:center;padding:1px;margin:0;font-weight:700" onchange="setCombatHpDirect(${i}, this.value)">
              <button class="b sm" onclick="alterCombatHp(${i},+1)">+1</button>
              <button class="b sm" onclick="alterCombatHp(${i},+5)">+5</button>
              <button class="b sm red" onclick="tableData.combatants.splice(${i},1);saveState();switchTab('combat')">✕</button>
            </div>
          </div>
          <div class="hp-bar"><div style="width:${pct}%;background:${barCol}"></div></div>
        </div>
        ${c.notes ? `<div class="mu" style="font-size:.75rem">${escapeHTML(c.notes)}</div>` : ""}
      </div>
    `;
  }).join("") || `<p class="mu card" style="text-align:center">Aucun combattant ne correspond aux filtres.</p>`;
}

function rollOneInit(i){
  const c = tableData.combatants[i], d20 = 1 + Math.floor(Math.random() * 20);
  c.lastRoll = d20; c.init = d20 + (c.baseInit || 10);
  saveState(); filterCombat();
}
function rollAllInit(){
  tableData.combatants.forEach(c => { const d = 1 + Math.floor(Math.random()*20); c.lastRoll = d; c.init = d + (c.baseInit || 10); });
  sortCombatants();
}
function rollMonstersInit(){
  tableData.combatants.forEach(c => { if(!c.isPj){ const d = 1 + Math.floor(Math.random()*20); c.lastRoll = d; c.init = d + (c.baseInit || 10); } });
  sortCombatants();
}
function sortCombatants(){ tableData.combatants.sort((a,b) => b.init - a.init); saveState(); switchTab("combat"); }
function clearCombat(){ if(confirm("Vider la piste de combat ?")){ tableData.combatants = []; saveState(); switchTab("combat"); } }
function alterCombatHp(i, d){ const c = tableData.combatants[i]; c.hp = Math.max(0, Math.min(c.hpMax, c.hp + d)); saveState(); filterCombat(); }
function setCombatHpDirect(i, v){ const c = tableData.combatants[i]; c.hp = Math.max(0, Math.min(c.hpMax, parseInt(v)||0)); saveState(); filterCombat(); }

/* ==================== 2. GROUPE PJ ==================== */
function viewGroupe(){
  return `
    <div class="card">
      <div class="row sp">
        <div>
          <h3 style="margin:0">Groupe d'Aventuriers</h3>
          <span class="mu">PJ enregistrés : <b id="pj-count">${tableData.pjs.length}</b></span>
        </div>
        <div class="row">
          <button class="b sm gold" onclick="document.getElementById('pj-files').click()">➕ Importer PJ (JSON)</button>
          <button class="b sm" onclick="addAllPjToCombat()">⚔️ Envoyer TOUS en combat</button>
          <input type="file" id="pj-files" hidden multiple accept=".json" onchange="handleFiles(this.files)">
        </div>
      </div>
      <div class="search-bar-box">
        <input id="pj-q" placeholder="Rechercher nom de héros, joueur, roleplay..." oninput="filterGroupe()">
        <select id="pj-prof" onchange="filterGroupe()">
          <option value="">Tous profils</option>
          ${[...new Set(tableData.pjs.map(p => p.profil).filter(Boolean))].map(pr => `<option value="${escapeHTML(pr)}">${escapeHTML(pr)}</option>`).join("")}
        </select>
        <select id="pj-race" onchange="filterGroupe()">
          <option value="">Toutes races</option>
          ${[...new Set(tableData.pjs.map(p => p.race).filter(Boolean))].map(rc => `<option value="${escapeHTML(rc)}">${escapeHTML(rc)}</option>`).join("")}
        </select>
        <button class="b sm" onclick="document.getElementById('pj-q').value='';document.getElementById('pj-prof').value='';document.getElementById('pj-race').value='';filterGroupe()">Effacer</button>
      </div>
    </div>
    <div class="g" id="pj-grid"></div>
  `;
}

function filterGroupe(){
  const q = (document.getElementById("pj-q")?.value || "").toLowerCase();
  const prof = document.getElementById("pj-prof")?.value || "";
  const race = document.getElementById("pj-race")?.value || "";
  const target = document.getElementById("pj-grid");
  if(!target) return;

  const filtered = tableData.pjs.filter((pj, i) => {
    const str = (pj.name + (pj.player || "") + (pj.persoTraits || "")).toLowerCase();
    const matchQ = str.includes(q);
    const matchP = !prof || pj.profil === prof;
    const matchR = !race || pj.race === race;
    pj._origIdx = i;
    return matchQ && matchP && matchR;
  });

  const countEl = document.getElementById("pj-count");
  if(countEl) countEl.textContent = `${filtered.length} / ${tableData.pjs.length}`;

  target.innerHTML = filtered.map(pj => {
    const idx = pj._origIdx;
    return `
      <div class="card">
        <div class="row sp">
          <div>
            <b style="font-size:1.1rem;color:var(--gold2)">${escapeHTML(pj.name)}</b>
            <div class="mu" style="font-size:.75rem">Joueur : <b>${escapeHTML(pj.player || "Anonyme")}</b> • ${escapeHTML(pj.race)} • ${escapeHTML(pj.profil)} Niv. ${pj.level}</div>
          </div>
          <button class="b sm red" onclick="tableData.pjs.splice(${idx},1);saveState();switchTab('groupe')">✕</button>
        </div>
        <div style="margin:6px 0">PV : <b>${pj.hp} / ${(pj.hpMaxManual || pj.hpBase || 10)}</b></div>
        ${pj.persoTraits ? `<div class="mu" style="font-size:.75rem;margin-bottom:6px"><b>Roleplay :</b> ${escapeHTML(pj.persoTraits)}</div>` : ""}
        <button class="b sm gold" style="width:100%" onclick="sendPjToCombat(${idx})">⚔️ Envoyer au Combat</button>
      </div>
    `;
  }).join("") || `<p class="mu card">Aucun personnage ne correspond aux filtres.</p>`;
}

function sendPjToCombat(idx){
  const p = tableData.pjs[idx];
  tableData.combatants.push({ n: p.name, isPj: true, hp: p.hp, hpMax: (p.hpMaxManual || p.hpBase || 10), def: 12, baseInit: 10, init: 10, notes: "" });
  saveState(); alert(`${p.name} rejoint le combat !`);
}
function addAllPjToCombat(){ tableData.pjs.forEach((p, idx) => sendPjToCombat(idx)); switchTab("combat"); }

/* ==================== 3. BESTIAIRE ==================== */
function viewBestiaire(){
  return `
    <div class="card">
      <div class="row sp">
        <div>
          <h3 style="margin:0">Bestiaire du Meneur</h3>
          <span class="mu">Créatures : <b id="best-count">${tableData.bestiaire.length}</b></span>
        </div>
        <div class="row">
          <button class="b sm gold" onclick="document.getElementById('best-import-btn').click()">📥 Importer Bestiaire (JSON)</button>

function filterBestiaire(){
  const q = (document.getElementById("best-q")?.value || "").toLowerCase();
  const nc = document.getElementById("best-nc")?.value || "";
  const fam = document.getElementById("best-fam")?.value || "";
  const target = document.getElementById("best-list");
  if(!target) return;

  const filtered = tableData.bestiaire.filter(m => {
    const mStr = (m.n + m.att + m.traits + (m.fam||"")).toLowerCase();
    const matchQ = mStr.includes(q);
    const matchNc = !nc || (nc === "10" ? parseInt(m.nc) >= 10 : m.nc === nc);
    const matchFam = !fam || m.fam === fam;
    return matchQ && matchNc && matchFam;
  });

  const countEl = document.getElementById("best-count");
  if(countEl) countEl.textContent = `${filtered.length} / ${tableData.bestiaire.length}`;

  target.innerHTML = filtered.map(m => `
    <details class="card">
      <summary>
        <b>${escapeHTML(m.n)}</b> 
        <span class="tag tag-nc">NC ${m.nc}</span>
        <span class="mu">${escapeHTML(m.fam || "")} • PV : ${m.pv} • DEF : ${m.def} • Init : ${m.init}</span>
      </summary>
      <div style="padding:8px;background:var(--p2);border-radius:6px;margin-top:6px">

        <div class="mu" style="margin-top:4px"><b>Capacités :</b> ${escapeHTML(m.traits)}</div>
        <button class="b sm gold" style="margin-top:8px" onclick="addMonsterToCombat('${escapeHTML(m.n)}')">⚔️ Lancer en Combat</button>
      </div>
    </details>
  `).join("") || `<p class="mu card">Aucune créature trouvée.</p>`;
}

function addMonsterToCombat(name){
  const m = tableData.bestiaire.find(x => x.n === name);
  if(!m) return;
  tableData.combatants.push({ n: m.n, isPj: false, hp: m.pv, hpMax: m.pv, def: m.def, baseInit: m.init, init: m.init, notes: m.att + " | " + m.traits });
  saveState(); alert(`${m.n} a été envoyé au combat !`);
}

      html += `

  if(cat !== "etats"){
    const filteredRegles = tableData.regles.filter(r => {
      const matchQ = (r.t + r.c + (r.cat || "")).toLowerCase().includes(q);

  const q = (document.getElementById("voie-q")?.value || "").toLowerCase();
  const vFilter = document.getElementById("voie-prof")?.value || "";
  const target = document.getElementById("voies-list");
  if(!target) return;

  // Grouper les capacités par voie
  const groups = {};
  tableData.sorts.forEach(s => {
    const vName = s.voie || "Voie Diverse";
    if(!groups[vName]) groups[vName] = [];
    groups[vName].push(s);
  });

  const matchingVoies = Object.keys(groups).filter(vName => {
    const matchV = !vFilter || vName === vFilter;
    const matchQ = vName.toLowerCase().includes(q) || groups[vName].some(cap => (cap.n + cap.t).toLowerCase().includes(q));
    return matchV && matchQ;
  });

  target.innerHTML = matchingVoies.map(vName => `
    <details class="card" open>
      <summary><b>${escapeHTML(vName)}</b> <span class="mu">(${groups[vName].length} rangs)</span></summary>
      <div style="padding:6px 0">
        ${groups[vName].sort((a,b) => (a.rang||0) - (b.rang||0)).map(c => `

              <b style="color:var(--gold2)">Rang ${c.rang || 1} : ${escapeHTML(c.n)}</b>

        <span class="tag tag-s">Rang ${s.rang || 1} • ${escapeHTML(s.portee || "Contact")}</span>
      </div>
      <div class="mu" style="font-size:.72rem">Voie : ${escapeHTML(s.voie || "Magie")} • Durée : ${escapeHTML(s.duree || "Instantané")}</div>
      <p style="margin-top:3px;font-size:.82rem">${escapeHTML(s.t)}</p>
    </div>
  `).join("") || `<p class="mu card">Aucun sort ne correspond aux critères.</p>`;
}

/* ==================== SAUVEGARDE & CHARGEMENT MASTER ==================== */
function saveMasterJSON(){
  const a = document.createElement("a");
  a.href = "data:application/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tableData, null, 2));
  a.download = "Campagne_CO_Master.json"; a.click();
}
function loadMasterJSON(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      tableData = JSON.parse(ev.target.result);
      saveState(); switchTab(curTab); alert("Campagne Master restaurée avec succès !");
    } catch(err){ alert("Erreur fichier Master."); }
  };
  r.readAsText(f);
}

function escapeHTML(str){
  return String(str ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

renderNav();
switchTab("combat");
</script>
